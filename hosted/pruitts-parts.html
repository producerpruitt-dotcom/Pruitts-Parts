<title>Pruitt's Parts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, search bar pinned on top, tab bar pinned at bottom on phones, nav in header on laptops. */
:root {
  --accent: #D9560B; --accent-press: #B04306; --on-accent: #FFFFFF;
  --bg: #F3F1EE; --card: #FFFFFF; --fg: #1D1B19; --muted: #625D57; --line: #DDD8D1;
  --loc-bg: #FFF0E4; --loc-fg: #6E2D04; --loc-rule: #F1CFB4;
  --danger: #B3261E; --danger-bg: #FCE9E8; --field: #FFFFFF; --search-fg: #1D1B19;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --tab-h: 68px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --accent: #F0752A; --accent-press: #D9560B; --on-accent: #1A0D04;
  --bg: #151413; --card: #211F1D; --fg: #F2EFEB; --muted: #ADA79F; --line: #3A3733;
  --loc-bg: #3B230F; --loc-fg: #FFD2AE; --loc-rule: #5A3719;
  --danger: #FF8A80; --danger-bg: #3C1715; --field: #2A2826; --search-fg: #1D1B19; color-scheme: dark } }
:root[data-theme="dark"] {
  --accent: #F0752A; --accent-press: #D9560B; --on-accent: #1A0D04;
  --bg: #151413; --card: #211F1D; --fg: #F2EFEB; --muted: #ADA79F; --line: #3A3733;
  --loc-bg: #3B230F; --loc-fg: #FFD2AE; --loc-rule: #5A3719;
  --danger: #FF8A80; --danger-bg: #3C1715; --field: #2A2826; --search-fg: #1D1B19; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 18px/1.45 var(--font); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }

.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 760px; margin: 0 auto; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--accent); color: var(--on-accent); padding-block: 12px 14px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-weight: 800; font-size: 22px; letter-spacing: -0.01em; text-decoration: none; }
.top-nav { display: none; gap: 4px; }
.top-nav a { text-decoration: none; padding: 7px 14px; border-radius: 999px; font-weight: 650; font-size: 16px; }
.top-nav a.on { background: rgba(255,255,255,.24); }
.search-wrap { position: relative; margin-top: 10px; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: #6F6A64; pointer-events: none; }
#q { width: 100%; height: 54px; border: 0; border-radius: 12px; padding: 0 48px; background: #FFFFFF; color: var(--search-fg); font-size: 19px; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
#q::placeholder { color: #77716A; }
#q::-webkit-search-cancel-button { display: none; }
#q:focus { outline: 3px solid rgba(255,255,255,.7); }
#clearQ { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: none; color: #6F6A64; font-size: 26px; cursor: pointer; }

main { padding-block: 14px calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 28px); }
h1 { font-size: 26px; margin: 6px 0 14px; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
p { margin: 0 0 10px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--card); padding: 9px 16px; border-radius: 999px; font-size: 16px; font-weight: 650; cursor: pointer; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.list { display: flex; flex-direction: column; gap: 10px; }
.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-decoration: none; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.card-name { font-weight: 750; font-size: 19px; min-width: 0; overflow-wrap: anywhere; }
.qty { flex: none; color: var(--muted); font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.qty.zero { color: var(--danger); }
.kind { font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* Location strip: the answer to "where is it?" */
.loc { display: flex; margin-top: 10px; border-radius: 10px; overflow: hidden; background: var(--loc-bg); color: var(--loc-fg); }
.loc > div { padding: 7px 12px; min-width: 0; flex: 1 1 auto; border-left: 1px solid var(--loc-rule); }
.loc > div:first-child { border-left: 0; }
.loc .lbl { display: block; font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; opacity: .8; }
.loc .val { display: block; font-weight: 800; font-size: 18px; overflow-wrap: anywhere; }
.loc.none { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.loc.big .val { font-size: 24px; }
.loc.big > div { padding: 12px 16px; }

.detail-name { font-size: 28px; font-weight: 800; margin: 4px 0 4px; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-top: 14px; }
.stepper { display: flex; align-items: center; gap: 16px; }
.stepper button { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 28px; cursor: pointer; }
.stepper .n { font-size: 32px; font-weight: 800; min-width: 3ch; text-align: center; font-variant-numeric: tabular-nums; }
.notes { white-space: pre-wrap; overflow-wrap: anywhere; }
.row-btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.back { display: inline-block; padding: 6px 0; font-size: 17px; color: var(--muted); }

.field { margin-bottom: 16px; }
.lab { display: block; font-size: 16px; font-weight: 750; margin-bottom: 6px; }
.input { width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--field); font-size: 18px; }
textarea.input { min-height: 90px; resize: vertical; }
.input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); }
.seg button { flex: 1; min-height: 52px; border: 0; background: none; font-weight: 750; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button.on { background: var(--accent); color: var(--on-accent); }
.loc-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.loc-grid .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
@media (max-width: 360px) { .loc-grid { grid-template-columns: 1fr; } }
.hint { font-size: 15px; color: var(--muted); margin-top: 6px; }
.check { display: flex; align-items: center; gap: 12px; font-size: 17px; }
.check input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 750; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:active { background: var(--accent-press); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--card); }
.btn.block { width: 100%; }
.btn + .btn.block { margin-top: 10px; }
.btn:disabled { opacity: .6; }
.error, .notice { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 16px; }
.error { background: var(--danger-bg); color: var(--danger); }
.notice { background: var(--loc-bg); color: var(--loc-fg); }

.loc-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; width: 100%; text-align: left; font: inherit; color: inherit; }
.loc-row .count { color: var(--muted); font-weight: 650; font-size: 16px; flex: none; }

.empty { text-align: center; padding: 36px 12px; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font-size: 20px; margin-bottom: 6px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs a { flex: 1; height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 650; }
.tabs a svg { width: 28px; height: 28px; }
.tabs a.on { color: var(--accent); }
.tabs a.add svg { color: var(--on-accent); background: var(--accent); border-radius: 50%; padding: 5px; width: 38px; height: 38px; }
@media (min-width: 760px) { .top-nav { display: flex; } .tabs { display: none; } main { padding-bottom: 40px; } }

#toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); transform: translate(-50%, 20px);
  background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 650; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 20; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 760px) { #toast { bottom: 24px; } }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<header class="top gutter">
  <div class="wrap">
    <div class="top-row">
      <a class="brand" href="#search">Pruitt's Parts</a>
      <nav class="top-nav" id="topNav">
        <a href="#search" data-tab="search">Search</a><a href="#add" data-tab="add">Add item</a>
        <a href="#locations" data-tab="locations">Locations</a><a href="#account" data-tab="account">Account</a>
      </nav>
    </div>
    <form class="search-wrap" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="What are you looking for?" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search" aria-label="Search your inventory">
      <button type="button" id="clearQ" aria-label="Clear search" hidden>×</button>
    </form>
  </div>
</header>

<main class="gutter"><div class="wrap" id="view">
  <div class="empty"><strong>Opening your inventory…</strong>Your tools, parts and hardware will show here, each with the spot where it's stored.</div>
</div></main>

<nav class="tabs" id="tabs">
  <a href="#search" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
  <a href="#add" data-tab="add" class="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</a>
  <a href="#locations" data-tab="locations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18M10 8h4M10 16h4"/></svg>Locations</a>
  <a href="#account" data-tab="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Account</a>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const KIND = { tool: 'Tool', part: 'Part', hardware: 'Hardware' };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };

  // ---------- state ----------
  const S = {
    status: 'loading',   // loading | ready | signedout | error
    slow: false, readOnly: false,
    items: [],           // [{id, name, kind, qty, notes, area, spot, bin, updated}]
    query: '', kind: '', place: null, downloads: null,
  };
  let col = null;

  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
  }
  const newId = () => 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const locLabel = (l) => [l.area, l.spot, l.bin].filter(Boolean).join(' › ');
  const locKey = (l) => JSON.stringify([l.area || '', l.spot || '', l.bin || '']);
  const clean = (v, max = 200) => String(v ?? '').trim().slice(0, max);

  // ---------- data ----------
  function writeFailed(e) {
    if (e && e.code === 'invalid_argument') {
      S.readOnly = true;
      return "You can look but not save. Ask the person who shared this page to give you Editor access.";
    }
    if (e && e.code === 'quota_exceeded') return 'Storage is full. Delete some items before adding more.';
    if (e && e.code === 'unavailable') return "Couldn't reach the server. Check your connection and try again.";
    return (e && e.message) || 'Saving failed. Try again.';
  }

  function validate(b) {
    const it = {
      name: clean(b.name), kind: KIND[b.kind] ? b.kind : 'part',
      qty: b.qty === '' || b.qty == null ? 1 : Number(b.qty),
      notes: clean(b.notes, 2000), area: clean(b.area, 80), spot: clean(b.spot, 80), bin: clean(b.bin, 80),
    };
    if (!it.name) throw new Error('Give the item a name.');
    if (!Number.isInteger(it.qty) || it.qty < 0 || it.qty > 1000000) throw new Error('Quantity must be a whole number, 0 or more.');
    if (!it.area && (it.spot || it.bin)) throw new Error('Fill in the Area too (for example Garage, Shop or Truck).');
    return it;
  }

  async function saveItem(id, body) {
    const data = { ...validate(body), updated: new Date().toISOString() };
    try { await col.doc(id).set(data); } catch (e) { throw new Error(writeFailed(e)); }
    return { id, ...data };
  }

  // ---------- search ----------
  const stem = (t) => (t.length > 3 && /(ch|sh|x|ss)es$/.test(t)) ? t.slice(0, -2)
    : (t.length > 3 && t.endsWith('s') && !t.endsWith('ss')) ? t.slice(0, -1) : t;

  function search(q, kind) {
    const tokens = q.toLowerCase().split(/[\s,]+/).filter(Boolean).slice(0, 8).map(stem);
    let rows = S.items.filter((i) => !kind || i.kind === kind);
    if (!tokens.length) return rows.slice().sort((a, b) => (b.updated || '').localeCompare(a.updated || '')).slice(0, 50);
    rows = rows.filter((i) => {
      const hay = `${i.name} ${i.notes} ${i.area} ${i.spot} ${i.bin} ${i.kind}`.toLowerCase();
      return tokens.every((t) => hay.includes(t));
    });
    const full = tokens.join(' ');
    const score = (i) => {
      const n = i.name.toLowerCase();
      if (n.startsWith(full)) return 0;
      if (tokens.every((t) => n.includes(t))) return n.startsWith(tokens[0]) ? 1 : 2;
      return 3;
    };
    return rows.sort((a, b) => score(a) - score(b) || a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
  }

  function locations() {
    const m = new Map();
    for (const i of S.items) {
      if (!i.area) continue;
      const k = locKey(i);
      if (!m.has(k)) m.set(k, { area: i.area, spot: i.spot || '', bin: i.bin || '', count: 0 });
      m.get(k).count++;
    }
    const cmp = (a, b) => a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true });
    return [...m.values()].sort((a, b) => cmp(a.area, b.area) || cmp(a.spot, b.spot) || cmp(a.bin, b.bin));
  }

  // ---------- pieces ----------
  function locStrip(l, big) {
    if (!l || !l.area) return `<div class="loc none${big ? ' big' : ''}"><div><span class="lbl">Location</span><span class="val">Not set</span></div></div>`;
    const parts = [['Area', l.area], ['Spot', l.spot], ['Bin', l.bin]].filter(([, v]) => v);
    return `<div class="loc${big ? ' big' : ''}">${parts.map(([k, v]) => `<div><span class="lbl">${k}</span><span class="val">${esc(v)}</span></div>`).join('')}</div>`;
  }
  const card = (i) => `<a class="card" href="#item-${i.id}">
      <div class="card-head"><span class="card-name">${esc(i.name)}</span>
        <span class="qty${i.qty === 0 ? ' zero' : ''}">${i.qty === 0 ? 'Out' : 'Qty ' + i.qty}</span></div>
      <span class="kind">${KIND[i.kind]}</span>${locStrip(i)}</a>`;

  function datalists() {
    const uniq = (a) => [...new Set(a.filter(Boolean))].sort((x, y) => x.localeCompare(y));
    const opts = (a) => a.map((v) => `<option value="${esc(v)}">`).join('');
    return `<datalist id="dl-area">${opts(uniq(S.items.map((i) => i.area)))}</datalist>
      <datalist id="dl-spot">${opts(uniq(S.items.map((i) => i.spot)))}</datalist>
      <datalist id="dl-bin">${opts(uniq(S.items.map((i) => i.bin)))}</datalist>`;
  }
  const locFields = (l, p = '') => `<div class="loc-grid">
      <div><label class="lab" for="${p}area">Area</label><input class="input" id="${p}area" list="dl-area" value="${esc(l.area)}" placeholder="Garage" autocomplete="off"></div>
      <div><label class="lab" for="${p}spot">Spot</label><input class="input" id="${p}spot" list="dl-spot" value="${esc(l.spot)}" placeholder="Red toolbox" autocomplete="off"></div>
      <div><label class="lab" for="${p}bin">Bin / Drawer</label><input class="input" id="${p}bin" list="dl-bin" value="${esc(l.bin)}" placeholder="Drawer 2" autocomplete="off"></div>
    </div>${datalists()}`;

  // Two-tap delete, since pop-up confirmations don't work here.
  function armButton(btn, armedText, action) {
    let armed = false, t;
    const label = btn.textContent;
    btn.addEventListener('click', async () => {
      if (!armed) {
        armed = true; btn.classList.add('armed'); btn.textContent = armedText;
        t = setTimeout(() => { armed = false; btn.classList.remove('armed'); btn.textContent = label; }, 4000);
        return;
      }
      clearTimeout(t); btn.disabled = true; await action();
    });
  }

  // ---------- views ----------
  const view = () => $('#view');
  function setTab(tab) { document.querySelectorAll('[data-tab]').forEach((a) => a.classList.toggle('on', a.dataset.tab === tab)); }

  function vSearch() {
    setTab('search');
    view().innerHTML = `<div class="chips" id="chips">${[['', 'All'], ['tool', 'Tools'], ['part', 'Parts'], ['hardware', 'Hardware']]
      .map(([k, l]) => `<button class="chip${S.kind === k ? ' on' : ''}" data-kind="${k}">${l}</button>`).join('')}</div><div id="results"></div>`;
    $('#chips').addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      S.kind = b.dataset.kind;
      document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('on', c === b));
      results();
    });
    results();
  }

  function results() {
    const box = $('#results'); if (!box) return;
    const q = S.query.trim();
    const rows = search(q, S.kind);
    if (!rows.length) {
      box.innerHTML = q
        ? `<div class="empty"><strong>Nothing matches “${esc(q)}”</strong>Try fewer words, or <a href="#add" id="addFromSearch">add it now</a>.</div>`
        : S.items.length
          ? `<div class="empty"><strong>No ${esc(S.kind)} items yet</strong></div>`
          : `<div class="empty"><strong>Nothing logged yet</strong>Tap <b>Add</b> to log your first tool or part and where it's kept.<br>Then type in the search bar any time to find it.</div>`;
      const a = $('#addFromSearch'); if (a) a.addEventListener('click', () => store.set('pp.prefill', q));
      return;
    }
    box.innerHTML = `<h2>${q ? `${rows.length} result${rows.length === 1 ? '' : 's'}` : 'Recently updated'}</h2><div class="list">${rows.slice(0, 200).map(card).join('')}</div>`;
  }

  function vItem(id) {
    setTab('');
    const it = S.items.find((i) => i.id === id);
    if (!it) { view().innerHTML = `<div class="empty"><strong>That item isn't here anymore</strong><a href="#search">Back to search</a></div>`; return; }
    view().innerHTML = `
      <a href="#search" class="back" id="back">‹ Back</a>
      <div class="kind">${KIND[it.kind]}</div>
      <div class="detail-name">${esc(it.name)}</div>
      ${locStrip(it, true)}
      <div class="panel"><span class="lab">How many on hand</span>
        <div class="stepper"><button id="dec" aria-label="One less">−</button><span class="n" id="qty">${it.qty}</span><button id="inc" aria-label="One more">+</button></div></div>
      ${it.notes ? `<div class="panel"><span class="lab">Notes</span><div class="notes">${esc(it.notes)}</div></div>` : ''}
      <div class="row-btns">
        <a class="btn primary" href="#edit-${it.id}">Edit or move</a>
        ${it.area ? '<button class="btn" id="here">What else is here?</button>' : ''}
        <button class="btn danger" id="del">Delete</button>
      </div>`;
    $('#back').addEventListener('click', (e) => { if (history.length > 1) { e.preventDefault(); history.back(); } });
    // Quantity: show the change at once, save once the taps stop.
    let pending = it.qty, timer;
    const bump = (d) => {
      pending = Math.max(0, pending + d); $('#qty').textContent = pending;
      clearTimeout(timer);
      timer = setTimeout(async () => {
        if (pending === it.qty) return;
        try { await col.doc(it.id).update({ qty: pending, updated: new Date().toISOString() }); }
        catch (e) { toast(writeFailed(e)); $('#qty').textContent = it.qty; pending = it.qty; }
      }, 700);
    };
    $('#dec').addEventListener('click', () => bump(-1));
    $('#inc').addEventListener('click', () => bump(1));
    const here = $('#here');
    if (here) here.addEventListener('click', () => { S.place = { area: it.area, spot: it.spot || '', bin: it.bin || '' }; go('place'); });
    armButton($('#del'), 'Tap again to delete', async () => {
      try { await col.doc(it.id).delete(); toast('Deleted'); go('search'); }
      catch (e) { toast(writeFailed(e)); render(); }
    });
  }

  function vForm(id) {
    const editing = !!id;
    setTab(editing ? '' : 'add');
    const existing = editing ? S.items.find((i) => i.id === id) : null;
    if (editing && !existing) { view().innerHTML = `<div class="empty"><strong>That item isn't here anymore</strong><a href="#search">Back to search</a></div>`; return; }
    const last = store.get('pp.lastLoc', { area: '', spot: '', bin: '' });
    const prefill = store.get('pp.prefill', ''); store.set('pp.prefill', '');
    const it = existing || { name: prefill, kind: store.get('pp.lastKind', 'part'), qty: 1, notes: '', ...last };
    let kind = it.kind;
    view().innerHTML = `
      <h1>${editing ? 'Edit item' : 'Add an item'}</h1>
      ${S.readOnly ? '<div class="notice">You can look but not save. Ask the person who shared this page to give you Editor access.</div>' : ''}
      <form id="f" novalidate>
        <div id="err"></div>
        <div class="field"><label class="lab" for="name">What is it?</label>
          <input class="input" id="name" maxlength="200" value="${esc(it.name)}" placeholder='e.g. 1/4" x 3" lag screws' autocomplete="off"></div>
        <div class="field"><span class="lab">Type</span>
          <div class="seg" id="seg">${Object.entries(KIND).map(([k, l]) => `<button type="button" data-kind="${k}" class="${kind === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
        <div class="field"><span class="lab">Where is it kept?</span>${locFields(it)}
          <div class="hint">Area is the room or vehicle. Spot is the shelf, cabinet or box. Bin is optional.</div></div>
        <div class="field"><label class="lab" for="qtyIn">How many</label>
          <input class="input" id="qtyIn" type="number" inputmode="numeric" min="0" step="1" value="${it.qty}"></div>
        <div class="field"><label class="lab" for="notes">Notes <span class="muted">(optional)</span></label>
          <textarea class="input" id="notes" maxlength="2000" placeholder="Size, brand, model, what it fits">${esc(it.notes)}</textarea></div>
        ${editing ? '' : `<div class="field"><label class="check"><input type="checkbox" id="another"${store.get('pp.another', true) ? ' checked' : ''}>Add another to the same spot after saving</label></div>`}
        <button class="btn primary block" type="submit" id="save">${editing ? 'Save changes' : 'Save item'}</button>
        ${editing ? `<a class="btn block" href="#item-${id}">Cancel</a>` : ''}
      </form>`;
    $('#seg').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      kind = b.dataset.kind; document.querySelectorAll('#seg button').forEach((x) => x.classList.toggle('on', x === b));
    });
    if (!it.name && matchMedia('(min-width: 760px)').matches) $('#name').focus();
    $('#f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = { name: $('#name').value, kind, qty: $('#qtyIn').value, notes: $('#notes').value, area: $('#area').value, spot: $('#spot').value, bin: $('#bin').value };
      const btn = $('#save'); btn.disabled = true;
      try {
        const saved = await saveItem(editing ? id : newId(), body);
        store.set('pp.lastLoc', { area: saved.area, spot: saved.spot, bin: saved.bin }); store.set('pp.lastKind', kind);
        const where = saved.area ? ' → ' + locLabel(saved) : '';
        if (editing) { toast('Saved' + where); go('item-' + id); return; }
        const another = $('#another').checked; store.set('pp.another', another);
        toast('Saved ' + saved.name + where);
        if (another) {
          $('#name').value = ''; $('#notes').value = ''; $('#qtyIn').value = 1; $('#err').innerHTML = '';
          btn.disabled = false; $('#name').focus();
        } else go('item-' + saved.id);
      } catch (err) {
        $('#err').innerHTML = `<div class="error">${esc(err.message)}</div>`; btn.disabled = false;
      }
    });
  }

  function vLocations() {
    setTab('locations');
    const locs = locations();
    if (!locs.length) { view().innerHTML = `<h1>Locations</h1><div class="empty"><strong>No locations yet</strong>They appear here as soon as you add an item and say where it's kept.</div>`; return; }
    const byArea = new Map();
    locs.forEach((l) => { if (!byArea.has(l.area)) byArea.set(l.area, []); byArea.get(l.area).push(l); });
    view().innerHTML = `<h1>Locations</h1><div id="locList">${[...byArea].map(([area, rows]) => `<h2>${esc(area)}</h2><div class="list">${rows.map((l) =>
      `<button class="card loc-row" data-k="${esc(locKey(l))}"><span class="card-name">${esc([l.spot, l.bin].filter(Boolean).join(' › ') || 'Anywhere in ' + l.area)}</span>
        <span class="count">${l.count} item${l.count === 1 ? '' : 's'} ›</span></button>`).join('')}</div>`).join('')}</div>`;
    $('#locList').addEventListener('click', (e) => {
      const b = e.target.closest('.loc-row'); if (!b) return;
      const [area, spot, bin] = JSON.parse(b.dataset.k); S.place = { area, spot, bin }; go('place');
    });
  }

  function vPlace() {
    setTab('locations');
    const p = S.place;
    if (!p) return go('locations');
    const rows = S.items.filter((i) => locKey(i) === locKey(p)).sort((a, b) => a.name.localeCompare(b.name));
    view().innerHTML = `
      <a href="#locations" class="back">‹ All locations</a>
      <h1>What's here</h1>${locStrip(p, true)}
      <div class="row-btns"><button class="btn primary" id="addHere">Add item here</button><button class="btn" id="ren">Rename or move this spot</button></div>
      <form id="rf" class="panel" hidden><div id="rerr"></div>${locFields(p, 'r')}
        <div class="hint">Everything in this spot moves with it. If you pick a name that already exists, the two are combined.</div>
        <div class="row-btns"><button class="btn primary" type="submit" id="rsave">Save</button></div></form>
      <h2>${rows.length} item${rows.length === 1 ? '' : 's'}</h2>
      <div class="list">${rows.map(card).join('') || '<div class="empty">Nothing stored here now.</div>'}</div>`;
    $('#addHere').addEventListener('click', () => { store.set('pp.lastLoc', p); go('add'); });
    $('#ren').addEventListener('click', () => { $('#rf').hidden = !$('#rf').hidden; });
    $('#rf').addEventListener('submit', async (e) => {
      e.preventDefault();
      const to = { area: clean($('#rarea').value, 80), spot: clean($('#rspot').value, 80), bin: clean($('#rbin').value, 80) };
      if (!to.area) { $('#rerr').innerHTML = '<div class="error">Fill in the Area.</div>'; return; }
      const btn = $('#rsave'); btn.disabled = true;
      try {
        for (const i of rows) await col.doc(i.id).update({ ...to, updated: new Date().toISOString() });
        S.place = to; toast('Moved ' + rows.length + ' item' + (rows.length === 1 ? '' : 's') + ' to ' + locLabel(to)); render();
      } catch (err) { $('#rerr').innerHTML = `<div class="error">${esc(writeFailed(err))}</div>`; btn.disabled = false; }
    });
  }

  // CSV
  function parseCsv(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"' && text[i + 1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter((r) => r.some((x) => x.trim()));
  }
  const csvCell = (v) => /[",\n\r]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);

  function vAccount() {
    setTab('account');
    view().innerHTML = `
      <h1>Account</h1>
      <div class="panel"><div class="card-name">${S.items.length} item${S.items.length === 1 ? '' : 's'} logged</div>
        <div class="muted small">Your list is private. Other people who use this page each see only their own.</div></div>
      <div class="panel"><span class="lab">Add many items from a spreadsheet</span>
        <p class="small muted">Make a sheet with these column headings, save it as CSV, and pick it here:<br>
        <b>name, type, quantity, area, spot, bin, notes</b><br>Type is tool, part or hardware. Only name is required.</p>
        <input type="file" id="csv" accept=".csv,text/csv" hidden>
        <div class="row-btns"><button class="btn" id="imp">Choose CSV file</button>${S.downloads ? '<button class="btn" id="exp">Save a backup copy</button>' : ''}</div>
        <div id="impMsg"></div></div>`;
    $('#imp').addEventListener('click', () => $('#csv').click());
    $('#csv').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const msg = $('#impMsg');
      const rows = parseCsv(await file.text());
      const head = (rows[0] || []).map((h) => h.trim().toLowerCase());
      const col_ = (n) => head.indexOf(n);
      if (col_('name') < 0) { msg.innerHTML = '<div class="error">The first row needs a heading called "name".</div>'; e.target.value = ''; return; }
      const get = (r, ...names) => { for (const n of names) if (col_(n) >= 0 && r[col_(n)]) return r[col_(n)]; return ''; };
      let added = 0; const errors = [];
      for (let k = 1; k < rows.length; k++) {
        const r = rows[k];
        msg.innerHTML = `<p class="small muted">Adding ${k} of ${rows.length - 1}…</p>`;
        try {
          await saveItem(newId(), { name: get(r, 'name'), kind: (get(r, 'type', 'kind') || 'part').trim().toLowerCase(),
            qty: get(r, 'quantity', 'qty').trim(), notes: get(r, 'notes'), area: get(r, 'area'), spot: get(r, 'spot'), bin: get(r, 'bin') });
          added++;
        } catch (err) { errors.push(`Row ${k + 1}: ${err.message}`); if (S.readOnly) break; }
      }
      msg.innerHTML = `<p class="small"><b>Added ${added} item${added === 1 ? '' : 's'}.</b></p>` +
        (errors.length ? `<div class="error small">${errors.slice(0, 30).map(esc).join('<br>')}</div>` : '');
      e.target.value = '';
    });
    const exp = $('#exp');
    if (exp) exp.addEventListener('click', async () => {
      const lines = ['name,type,quantity,area,spot,bin,notes'];
      S.items.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach((i) =>
        lines.push([i.name, i.kind, i.qty, i.area, i.spot, i.bin, i.notes].map((v) => csvCell(v ?? '')).join(',')));
      try { await S.downloads.save({ filename: 'pruitts-parts-backup.csv', data: lines.join('\n') }); }
      catch (err) { if (err && err.code !== 'declined') toast("Couldn't save the file."); }
    });
  }

  function vStatus() {
    setTab('');
    if (S.status === 'signedout') {
      view().innerHTML = `<div class="empty"><strong>Sign in to see your inventory</strong>
        Each person's list is kept under their own Claude sign-in. Sign in, then open this link again.</div>`;
    } else if (S.status === 'error') {
      view().innerHTML = `<div class="empty"><strong>Couldn't open your inventory</strong>Check your internet connection, then reload the page.</div>`;
    } else {
      view().innerHTML = `<div class="empty"><strong>${S.slow ? 'Still connecting…' : 'Opening your inventory…'}</strong>
        ${S.slow ? "Your list can't be reached yet. Check your internet connection." : "Your tools, parts and hardware will show here, each with the spot where it's stored."}</div>`;
    }
  }

  // ---------- router (hash names only: #search, #add, #item-x, #edit-x, #locations, #place, #account) ----------
  function go(name) { if (location.hash === '#' + name) render(); else location.hash = name; }
  function render() {
    if (S.status !== 'ready') return vStatus();
    const h = location.hash.replace(/^#/, '') || 'search';
    let m;
    if (h === 'search') return vSearch();
    if (h === 'add') return vForm(null);
    if ((m = h.match(/^edit-([A-Za-z0-9]+)$/))) return vForm(m[1]);
    if ((m = h.match(/^item-([A-Za-z0-9]+)$/))) return vItem(m[1]);
    if (h === 'locations') return vLocations();
    if (h === 'place') return vPlace();
    if (h === 'account') return vAccount();
    go('search');
  }
  // Live data changed: refresh lists, but never wipe a form someone is typing in.
  function refresh() {
    const h = location.hash.replace(/^#/, '') || 'search';
    if (h === 'add' || h.startsWith('edit-')) return;
    if (h === 'search' && $('#results')) return results();
    render();
  }
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

  // ---------- search bar ----------
  const q = $('#q'), clearQ = $('#clearQ');
  let qt;
  q.addEventListener('input', () => {
    S.query = q.value; clearQ.hidden = !q.value;
    clearTimeout(qt);
    qt = setTimeout(() => { const h = location.hash.replace(/^#/, ''); if (h && h !== 'search') go('search'); else results(); }, 120);
  });
  $('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); q.blur(); });
  clearQ.addEventListener('click', () => { S.query = ''; q.value = ''; clearQ.hidden = true; q.focus(); results(); });

  // ---------- connect ----------
  async function connect() {
    const c = window.claude;
    if (!c || !c.use) { S.status = 'signedout'; return render(); }
    const [db, user, downloads] = await Promise.all([c.use('db'), c.use('user'), c.use('downloads')]);
    S.downloads = downloads;
    const uid = user ? await user.id() : null;
    if (!db || !uid) { S.status = 'signedout'; return render(); }
    col = db.collection('data/users/' + uid);
    const slowTimer = setTimeout(() => { if (S.status === 'loading') { S.slow = true; render(); } }, 10000);
    col.onSnapshot((snap) => {
      S.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (!snap.metadata.fromCache) clearTimeout(slowTimer);
      const first = S.status !== 'ready';
      S.status = 'ready';
      if (first) render(); else refresh();
    }, () => { clearTimeout(slowTimer); if (S.status !== 'ready') { S.status = 'error'; render(); } else toast('Lost the connection to your list. Reload the page.'); });
  }
  render();
  connect().catch(() => { S.status = 'error'; render(); });
})();
</script>
